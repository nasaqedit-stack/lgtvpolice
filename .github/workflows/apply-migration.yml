name: Apply Submissions Migration

on:
  workflow_dispatch:

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - name: Install Supabase CLI
        run: |
          npm install -g supabase@latest
      - name: Apply migration via Supabase CLI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing Supabase credentials"
            exit 1
          fi
          # Extract project ref from URL
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          echo "Project ref: $PROJECT_REF"
          
          # Apply migration using Supabase CLI with service role key
          supabase migration up --project-ref "$PROJECT_REF" --db-url "postgresql://postgres:$SUPABASE_SERVICE_ROLE_KEY@db.$PROJECT_REF.supabase.co:5432/postgres" || {
            echo "Migration failed, trying alternative approach..."
            # Try applying via SQL API
            MIGRATION_SQL=$(cat supabase/migrations/20261009000000_public_submissions.sql)
            curl -X POST "$SUPABASE_URL/rest/v1/rpc/exec_sql" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"sql\": $(echo "$MIGRATION_SQL" | jq -Rs .)}" || true
          }
